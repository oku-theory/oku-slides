# cargo deny check : licences, avis de sécurité, sources, doublons.

[graph]
all-features = true

[advisories]
# RUSTSEC-2026-0194/0195 (quick-xml) : 0.38, via typst-library → hayagriva →
# citationberg, lecture de styles CSL de bibliographie (Oku Slides ne donne jamais de
# fichier de bibliographie à Typst) ; 0.37, via office2pdf → umya-spreadsheet, lecture
# des classeurs XLSX (le témoin de l'import ne reçoit que des PPTX). À retirer quand
# Typst et office2pdf suivront.
# RUSTSEC-2026-0192 (ttf-parser non maintenu) : Typst 0.15, fontdb, rustybuzz et
# office2pdf en dépendent ; l'import le lit pour les noms, droits et métriques des
# polices (fonts/face.rs). Suivre la migration de Typst (t-890).
# RUSTSEC-2026-0367/0368/0369 (zip < 9) : seuls `ZipArchive::extract` et
# `ZipStreamReader::extract` sont touchés (bits SUID, liens symboliques hors du dossier).
# Le workspace est en zip 9 ; restent zip 0.6 et 8 via office2pdf (et docx-rs), zip 2 via
# umya-spreadsheet et ndarray-npy (dictée), qui lisent les entrées une à une sans jamais
# appeler `extract` (vérifié dans leurs sources, t-897).
# À retirer quand ils passeront en zip 9 (t-899).
# Tenir .cargo/audit.toml aligné sur cette liste.
ignore = [
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser non maintenu, tiré par Typst ; l'import suivra la migration de Typst" },
    { id = "RUSTSEC-2026-0194", reason = "quick-xml via les bibliographies de Typst et le XLSX d'office2pdf, jamais atteints par Oku Slides" },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml via les bibliographies de Typst et le XLSX d'office2pdf, jamais atteints par Oku Slides" },
    { id = "RUSTSEC-2026-0367", reason = "zip < 9 transitif (office2pdf, docx-rs, umya-spreadsheet, ndarray-npy), qui n'appelle jamais extract" },
    { id = "RUSTSEC-2026-0368", reason = "zip < 9 transitif (office2pdf, docx-rs, umya-spreadsheet, ndarray-npy), qui n'appelle jamais extract" },
    { id = "RUSTSEC-2026-0369", reason = "zip < 9 transitif (office2pdf, docx-rs, umya-spreadsheet, ndarray-npy), qui n'appelle jamais extract" },
]
unmaintained = "workspace"

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9
# libfuzzer-sys ((MIT OR Apache-2.0) AND NCSA) : tiré par office2pdf → image (avif) → ravif → rav1e,
# qui ne le compile que pour son fuzzing ; jamais construit ni livré (t-692, lot 4).
exceptions = [
    { crate = "libfuzzer-sys", allow = ["NCSA"] },
]

[licenses.private]
# Les crates du workspace ne sont pas publiées.
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
