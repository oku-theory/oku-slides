[package]
name = "oku-slides-app"
description = "Oku Slides : l'application de bureau (Tauri)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build.workspace = true

[dependencies]
oku-slides-session.workspace = true
oku-slides-stt.workspace = true
oku-slides-platform.workspace = true
color-eyre.workspace = true
tracing.workspace = true
serde_json.workspace = true
tauri.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-window-state.workspace = true
tauri-plugin-single-instance.workspace = true
# Seulement pour reconnaître une fenêtre détruite (`window_state::is_window_gone`).
tauri-runtime.workspace = true

# Dictée sur Mac : calcul par Accelerate (le framework d'Apple).
[target.'cfg(target_os = "macos")'.dependencies]
oku-slides-stt = { workspace = true, features = ["accelerate"] }

[dev-dependencies]
speculoos.workspace = true

[lints]
workspace = true
