[package]
name = "oku-slides-stt"
description = "Oku Slides speech: dictation (microphone, voice detection, Whisper, Apple or API) and OS voices."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# macOS : calcul matriciel par Accelerate, le framework d'Apple.
accelerate = ["ct2rs/accelerate"]
# e2e only (`fake_source.rs`): listening hears lines appended to `stt.fake_utterances`. Turned on
# by `just e2e` alone, through oku-slides-cli/e2e-fakes; a release build refuses to compile it.
e2e-fakes = ["oku-slides-platform/e2e-fakes"]
# Test helpers shared with other crates' tests (`hand_voice`): a hand-driven voice and clock.
test-support = []

[dependencies]
sys-locale.workspace = true
oku-slides-i18n.workspace = true
oku-slides-platform = { workspace = true, features = ["download"] }
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
async-openai.workspace = true
reqwest.workspace = true
tower.workspace = true
http.workspace = true
tokio = { workspace = true, features = ["rt", "time"] }
url.workspace = true
snafu.workspace = true
# CTranslate2, le moteur de faster-whisper.
ct2rs.workspace = true
tokenizers.workspace = true
mel_spec.workspace = true
ndarray.workspace = true
# Détection de la voix, en Rust pur.
earshot.workspace = true
cpal.workspace = true

# macOS seulement : ailleurs, la bibliothèque de swift-rs liée au script de build y laisse des
# symboles du runtime Swift non résolus (LNK2019 sous Windows).
[target.'cfg(target_os = "macos")'.build-dependencies]
swift-rs = { workspace = true, features = ["build"] }

# Windows only: the OS voice (speak/windows.rs).
[target.'cfg(windows)'.dependencies]
windows.workspace = true

[dev-dependencies]
tiny_http.workspace = true
speculoos.workspace = true
rstest.workspace = true
hound.workspace = true
tempfile.workspace = true

# macOS only: the duplex hardware test runs the main run loop (AVFoundation's callbacks need it).
[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-core-foundation.workspace = true

# Its own `main`: the main thread runs the run loop, which libtest keeps for itself.
[[test]]
name = "duplex"
harness = false

[lints]
workspace = true
