# Releases de l'app de bureau (Windows, macOS, Linux), lancées à la main depuis l'onglet Actions.
# Le job version monte la version (patch, minor ou major) et pousse ce commit sur main ; chaque
# plateforme cochée construit ensuite ses paquets depuis ce commit (`cargo tauri build`) et les
# dépose dans une même release brouillon `v<version>`, publiée une fois ces plateformes construites.
# `aucune` garde la version courante et construit depuis main : de quoi compléter une release
# (une plateforme en échec, corrigée depuis) sans monter la version.
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Partie de la version à monter
        type: choice
        options: [patch, minor, major, aucune]
        default: patch
      macos_arm:
        description: macOS (Apple Silicon)
        type: boolean
        default: true
      macos_intel:
        description: macOS (Intel)
        type: boolean
        default: true
      linux:
        description: Linux
        type: boolean
        default: true
      windows:
        description: Windows
        type: boolean
        default: true

permissions:
  contents: write

# Une seule release à la fois : deux lancements écriraient dans le même brouillon.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Un build en échec se relance avec « Re-run failed jobs » : la version déjà montée est réutilisée.
  # Relancer tout le workflow la monterait une seconde fois.
  version:
    name: Version
    # ubuntu-22.04 est en dépréciation (fenêtres de brownout jusqu'au retrait, avril 2027) : les
    # jobs sans compilation passent en 24.04. Le build Linux y reste pour sa glibc plus ancienne.
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.bump.outputs.version }}
      sha: ${{ steps.bump.outputs.sha }}
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      # Avant le bump : sans plateforme cochée, rien n'est poussé.
      - name: Plateformes choisies
        id: targets
        env:
          MACOS_ARM: ${{ inputs.macos_arm }}
          MACOS_INTEL: ${{ inputs.macos_intel }}
          LINUX: ${{ inputs.linux }}
          WINDOWS: ${{ inputs.windows }}
        run: |
          matrix=$(jq -cn \
            --argjson macos_arm "$MACOS_ARM" --argjson macos_intel "$MACOS_INTEL" \
            --argjson linux "$LINUX" --argjson windows "$WINDOWS" '
            [ if $macos_arm then {name: "macOS (Apple Silicon)", runner: "macos-15"} else empty end,
              if $macos_intel then {name: "macOS (Intel)", runner: "macos-15-intel"} else empty end,
              if $linux then {name: "Linux", runner: "ubuntu-22.04"} else empty end,
              if $windows then {name: "Windows", runner: "windows-2022"} else empty end ]
            | {include: .}')
          [ "$(jq '.include | length' <<<"$matrix")" -gt 0 ] || { echo "::error::aucune plateforme cochée"; exit 1; }
          echo "Plateformes : $(jq -r '[.include[].name] | join(", ")' <<<"$matrix")"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Version montée et poussée
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          if [ "$BUMP" = aucune ]; then
            version=$(jq -r .version src-tauri/tauri.conf.json)
          else
            version=$(.github/scripts/bump-version.sh "$BUMP")
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "chore(release) : v$version"
            git push origin HEAD:main
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: version
    strategy:
      # Une plateforme en échec n'annule pas les autres : le run passe quand même en rouge et la
      # release reste un brouillon (le job publish ne tourne pas).
      fail-fast: false
      # Plateformes cochées au lancement (job version).
      matrix: ${{ fromJSON(needs.version.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    env:
      TAURI_CLI_VERSION: 2.11.5
    # CTranslate2 (dictée) se compile en C++ : long sans cache.
    timeout-minutes: 120
    steps:
      # Les polices embarquées (bundle.resources) sont en Git LFS.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}
          lfs: true

      # Une police restée pointeur LFS (quota dépassé…) partirait telle quelle dans les paquets.
      - name: Polices récupérées
        shell: bash
        run: |
          if grep -l "^version https://git-lfs" assets/fonts/*.ttf assets/fonts/*.otf 2>/dev/null; then
            echo "::error::polices non récupérées (pointeurs Git LFS)"
            exit 1
          fi

      # Le pont Swift de la dictée (moteur d'Apple) compile contre le SDK macOS 26 ; les runners
      # macos-15 ont Xcode 16.4 par défaut, mais installent aussi Xcode 26.0.1 à 26.3 (images x64 et
      # arm64, actions/runner-images, images/macos/macos-15*-Readme.md) : on prend le plus récent.
      - name: Xcode 26 (macOS)
        if: runner.os == 'macOS'
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$xcode" ] || { echo "::error::aucun Xcode 26 sur ce runner"; ls -d /Applications/Xcode*.app; exit 1; }
          sudo xcode-select -s "$xcode/Contents/Developer"
          sdk=$(xcrun --sdk macosx --show-sdk-version)
          echo "Xcode : $xcode, SDK macOS $sdk"
          [ "${sdk%%.*}" -ge 26 ] || { echo "::error::SDK macOS $sdk (26 ou plus requis)"; exit 1; }

      - name: Dépendances système (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libasound2-dev

      # Versions figées : une release se reconstruit à l'identique. À monter avec l'outillage local.
      - uses: dtolnay/rust-toolchain@1.98.1

      - uses: Swatinem/rust-cache@v2
        with:
          key: release

      - uses: taiki-e/install-action@v2
        if: runner.os != 'macOS' || runner.arch != 'ARM64'
        with:
          tool: tauri-cli@${{ env.TAURI_CLI_VERSION }}

      # tauri-cli n'a pas de binaire précompilé arm64 : install-action prendrait celui pour x86_64,
      # lancé sous Rosetta. Ses enfants hériteraient du mode x86_64 (CMake verrait un hôte x86_64
      # et ruy compilerait ses noyaux AVX) et le .dmg serait nommé _x64. Compilé ici en natif.
      - name: tauri-cli natif (macOS Apple Silicon)
        if: runner.os == 'macOS' && runner.arch == 'ARM64'
        # Le cache de rust-cache (~/.cargo/bin) peut restaurer un cargo-tauri x86_64, que
        # `cargo install` garderait (« already installed ») : réinstallation forcée dans ce cas.
        run: |
          bin="$HOME/.cargo/bin/cargo-tauri"
          if ! { [ -x "$bin" ] && file "$bin" | grep -q arm64 \
                 && "$bin" tauri --version | grep -qF "$TAURI_CLI_VERSION"; }; then
            cargo install tauri-cli --locked --force --version "$TAURI_CLI_VERSION"
          fi
          file "$(command -v cargo-tauri)" | grep -q arm64 || { echo "::error::cargo-tauri n'est pas arm64"; exit 1; }

      # aws-lc-sys (rustls, via rust-mcp-sdk) assemble avec NASM, absent du runner Windows : ses
      # objets précompilés le remplacent.
      - name: NASM précompilé et CRT statique (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "AWS_LC_SYS_PREBUILT_NASM=1" >> "$GITHUB_ENV"
          # CTranslate2 se compile avec la CRT statique (/MT) : tout le binaire doit la suivre,
          # sinon l'édition de liens échoue (LNK2038). Recommandé par le README de ct2rs.
          echo "RUSTFLAGS=-C target-feature=+crt-static" >> "$GITHUB_ENV"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # `beforeBuildCommand` (bun run build) suppose les dépendances de l'interface installées.
      - name: Dépendances de l'interface
        working-directory: ui
        run: bun install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signature ad hoc des deux jobs macOS (Apple Silicon et Intel), ignorée ailleurs : sans
          # certificat Apple, l'app Apple Silicon doit au moins être signée pour se lancer.
          APPLE_SIGNING_IDENTITY: "-"
        with:
          tauriScript: cargo tauri
          # `__VERSION__` : remplacé par tauri-action par la version de src-tauri/tauri.conf.json.
          tagName: v__VERSION__
          releaseName: Oku Slides v__VERSION__
          releaseBody: Paquets Windows, macOS et Linux construits par le workflow Release.
          releaseDraft: true
          prerelease: false

  # Les plateformes choisies ont déposé leurs paquets : le brouillon est publié, ce qui crée le tag
  # `v<version>` sur le commit de la version. Un build en échec saute ce job (needs) et laisse le
  # brouillon tel quel.
  publish:
    name: Publication
    needs: [version, build]
    runs-on: ubuntu-24.04
    steps:
      - name: Brouillon publié
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ needs.version.outputs.version }}
          SHA: ${{ needs.version.outputs.sha }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest --target "$SHA"
