# Clippy : seuils du projet (le reste est dans [workspace.lints] de Cargo.toml).
too-many-arguments-threshold = 6
cognitive-complexity-threshold = 30
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
# Product names written as is in docs; ".." keeps the default list.
doc-valid-idents = [
  "ECharts", "OKLab", "OpenDAL", "LibreOffice", "PowerPoint", "DrawingML", "CommonMark", "WKWebView", "SmartArt",
  "OpenAI", "CTranslate2", "ChatML", "MicroType", "PptxGenJS", "AppImage", "SplitMix64", "SpeechAnalyzer", "..",
]
