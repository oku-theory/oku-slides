[workspace]
resolver = "3"
members = ["crates/*", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
authors = ["Matthieu"]
# Crates internes à l'app : jamais publiées (cargo-deny ignore leur licence).
publish = false

[workspace.dependencies]
oku-slides-core = { path = "crates/oku-slides-core" }
oku-slides-render = { path = "crates/oku-slides-render" }
oku-slides-pdf = { path = "crates/oku-slides-pdf" }
oku-slides-session = { path = "crates/oku-slides-session" }
oku-slides-stt = { path = "crates/oku-slides-stt" }
oku-slides-chart = { path = "crates/oku-slides-chart" }
oku-slides-a2ui = { path = "crates/oku-slides-a2ui" }
oku-slides-platform = { path = "crates/oku-slides-platform" }
oku-slides-i18n = { path = "crates/oku-slides-i18n" }
oku-slides-mcp = { path = "crates/oku-slides-mcp" }
oku-slides-agent = { path = "crates/oku-slides-agent" }
# Agent : MCP 1.x (ère legacy ≤ 2025-11-25, celle des clients des agents ; voir écart 6) et ACP
rust-mcp-sdk = "=1.1.0"
rust-mcp-axum = "=1.0.2"
agent-client-protocol = "=2.2.0"
tokio-util = { version = "0.7", features = ["compat", "rt"] }
async-trait = "0.1"
base64 = "0.22"
getrandom = { version = "0.3", features = ["std"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["preserve_order"] }
schemars = "1"
snafu = "0.9"
toml_edit = "0.25"
zip = { version = "8", default-features = false, features = ["deflate"] }
sha2 = "0.10"
hex = "0.4"
lopdf = "0.45"
typst = "0.15.1"
typst-pdf = "0.15.1"
typst-svg = "0.15.1"
typst-render = "0.15.1"
typst-assets = { version = "0.15.1", features = ["fonts"] }
time = { version = "0.3", features = ["formatting", "local-offset", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
color-eyre = "0.6"
config = { version = "0.15", default-features = false, features = ["toml"] }
opendal = { version = "0.59", default-features = false, features = ["services-fs", "blocking"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
ctrlc = { version = "3.5", features = ["termination"] }
fluent-bundle = "0.16"
unic-langid = "0.9"
sys-locale = "0.3"
clap = { version = "4", features = ["derive"] }
charts-rs = "1.1"
json-patch = "4"
typst-layout = "0.15.1"
tiny_http = "0.12"
similar = "3"
loro = "1.16"
# Dictée
ct2rs = { version = "0.10", default-features = false, features = ["whisper", "ruy"] }
# Même version que ct2rs : son tokenizer se construit depuis un tokenizers::Tokenizer.
tokenizers = { version = "0.22", default-features = false }
mel_spec = "0.3"
ndarray = "0.16"
earshot = "1.2"
cpal = "0.18"
ureq = "3"
# App de bureau
tauri = "2.11"
tauri-build = "2"
tauri-plugin-dialog = "2.7"
tauri-plugin-window-state = "2.4"
tauri-plugin-single-instance = "2.4"
tauri-runtime = "2.11"
# Tests
hound = "3"
speculoos = "0.13"
insta = { version = "1", features = ["json"] }
rstest = "0.26"
proptest = "1"
# Somme de contrôle des snapshots Loro : forger un snapshot malformé mais accepté.
xxhash-rust = { version = "0.8", features = ["xxh32"] }
loro-kv-store = "1.16"
bytes = "1"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[workspace.lints.rust]
missing_debug_implementations = "warn"
unsafe_code = "deny"

[profile.dev.package."*"]
opt-level = 2
# Pas d'infos de débogage pour les dépendances : builds plus légers et plus rapides.
debug = false
