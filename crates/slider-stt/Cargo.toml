mel_spec.workspace = true
ndarray.workspace = true
# Détection de la voix, en Rust pur.
earshot.workspace = true
cpal.workspace = true
ureq.workspace = true

[dev-dependencies]
tiny_http.workspace = true
speculoos.workspace = true
hound.workspace = true

[lints]
workspace = true
