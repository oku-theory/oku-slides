[workspace]
resolver = "3"
members = ["crates/*", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["Matthieu"]
# Crates internes à l'app : jamais publiées (cargo-deny ignore leur licence).
publish = false

[workspace.dependencies]
slider-core = { path = "crates/slider-core" }
slider-render = { path = "crates/slider-render" }
slider-pdf = { path = "crates/slider-pdf" }
slider-session = { path = "crates/slider-session" }
slider-stt = { path = "crates/slider-stt" }
slider-chart = { path = "crates/slider-chart" }
slider-platform = { path = "crates/slider-platform" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["preserve_order"] }
schemars = "1"
snafu = "0.9"
zip = { version = "8", default-features = false, features = ["deflate"] }
sha2 = "0.10"
hex = "0.4"
lopdf = "0.45"
typst = "0.15.1"
typst-pdf = "0.15.1"
typst-svg = "0.15.1"
typst-assets = { version = "0.15.1", features = ["fonts"] }
time = { version = "0.3", features = ["formatting", "local-offset", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
color-eyre = "0.6"
config = { version = "0.15", default-features = false, features = ["toml"] }
clap = { version = "4", features = ["derive"] }
charts-rs = "1.1"
json-patch = "4"
typst-layout = "0.15.1"
tiny_http = "0.12"
# Dictée
ct2rs = { version = "0.10", default-features = false, features = ["whisper", "ruy"] }
mel_spec = "0.3"
ndarray = "0.16"
earshot = "1.2"
cpal = "0.18"
ureq = "3"
# App de bureau
tauri = "2"
tauri-build = "2"
tauri-plugin-dialog = "2"
# Tests
hound = "3"
pretty_assertions = "1"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[workspace.lints.rust]
missing_debug_implementations = "warn"
unsafe_code = "deny"

[profile.dev.package."*"]
opt-level = 2
# Pas d'infos de débogage pour les dépendances : builds plus légers et plus rapides.
debug = false
