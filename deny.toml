# cargo deny check : licences, avis de sécurité, sources, doublons.

[graph]
all-features = true

[advisories]
# RUSTSEC-2026-0194/0195 (quick-xml < 0.41): 0.38, via typst-library → hayagriva →
# citationberg, reading CSL bibliography styles (Oku Slides never gives Typst a
# bibliography file). office2pdf 0.10 is on 0.41, patched. Remove when Typst follows.
# RUSTSEC-2026-0192 (ttf-parser unmaintained): Typst 0.15, fontdb, rustybuzz and
# office2pdf depend on it; the import reads font names, rights and metrics with it
# (fonts/face.rs). Follow Typst's migration (t-890).
# RUSTSEC-2026-0367/0368/0369/0429 (zip < 9): only `ZipArchive::extract` and
# `ZipStreamReader::extract` are affected (SUID bits, symlinks out of the directory, abort
# on a symlink entry with a large declared size, t-1512).
# The workspace and office2pdf 0.10 are on zip 9 (t-899); the one zip < 9 left is 2.4.2
# via mel_spec 0.3.4 → ndarray-npy 0.9.1 (dictation), which never calls `extract` (t-897);
# mel_spec only uses ndarray-npy in its #[cfg(test)] modules, so zip 2.4.2 never runs (t-1512).
# mel_spec 0.5 still pulls ndarray-npy 0.9, ct2rs 0.10 requires mel_spec 0.3, and ndarray-npy
# 0.10 is on zip 6: remove when ndarray-npy moves to zip 9.
# Keep .cargo/audit.toml in line with this list.
ignore = [
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser unmaintained, pulled by Typst; the import follows Typst's migration" },
    { id = "RUSTSEC-2026-0194", reason = "quick-xml < 0.41 via the bibliographies of Typst, never reached by Oku Slides" },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml < 0.41 via the bibliographies of Typst, never reached by Oku Slides" },
    { id = "RUSTSEC-2026-0367", reason = "zip 2.4.2 via mel_spec → ndarray-npy (dictation), which never calls extract" },
    { id = "RUSTSEC-2026-0368", reason = "zip 2.4.2 via mel_spec → ndarray-npy (dictation), which never calls extract" },
    { id = "RUSTSEC-2026-0369", reason = "zip 2.4.2 via mel_spec → ndarray-npy (dictation), which never calls extract" },
    { id = "RUSTSEC-2026-0429", reason = "zip 2.4.2 via mel_spec → ndarray-npy, used only in mel_spec tests; extract never called" },
]
unmaintained = "workspace"

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9
# libfuzzer-sys ((MIT OR Apache-2.0) AND NCSA) : tiré par office2pdf → image (avif) → ravif → rav1e,
# qui ne le compile que pour son fuzzing ; jamais construit ni livré (t-692, lot 4).
exceptions = [
    { crate = "libfuzzer-sys", allow = ["NCSA"] },
]

[licenses.private]
# Les crates du workspace ne sont pas publiées.
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
