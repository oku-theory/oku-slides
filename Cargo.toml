[workspace]
resolver = "3"
members = ["crates/*", "src-tauri"]

[workspace.package]
version = "2.1.0"
edition = "2024"
rust-version = "1.92"
authors = ["Matthieu"]
# Crates internes à l'app : jamais publiées (cargo-deny ignore leur licence).
publish = false

[workspace.dependencies]
oku-slides-core = { path = "crates/oku-slides-core" }
oku-slides-render = { path = "crates/oku-slides-render" }
oku-slides-pdf = { path = "crates/oku-slides-pdf" }
oku-slides-session = { path = "crates/oku-slides-session" }
oku-slides-stt = { path = "crates/oku-slides-stt" }
oku-slides-chart = { path = "crates/oku-slides-chart" }
oku-slides-a2ui = { path = "crates/oku-slides-a2ui" }
oku-slides-platform = { path = "crates/oku-slides-platform" }
oku-slides-i18n = { path = "crates/oku-slides-i18n" }
oku-slides-mcp = { path = "crates/oku-slides-mcp" }
oku-slides-agent = { path = "crates/oku-slides-agent" }
oku-slides-local-agent = { path = "crates/oku-slides-local-agent" }
oku-slides-render-worker = { path = "crates/oku-slides-render-worker" }
oku-slides-import = { path = "crates/oku-slides-import" }
oku-slides-reference = { path = "crates/oku-slides-reference" }
# Agent : MCP 1.x (ère legacy ≤ 2025-11-25, celle des clients des agents ; voir écart 6) et ACP
rust-mcp-sdk = "=1.1.0"
rust-mcp-axum = "=1.0.2"
agent-client-protocol = "=2.2.0"
tokio-util = { version = "0.7", features = ["compat", "rt"] }
async-trait = "0.1"
base64 = "0.22"
getrandom = { version = "0.3", features = ["std"] }
# Identité des packs de modèles (t-328) : UUID v4.
uuid = { version = "1", features = ["v4", "serde"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["preserve_order"] }
schemars = "1"
snafu = "0.9"
toml_edit = "0.25"
zip = { version = "9", default-features = false, features = ["deflate"] }
# Le lecteur zip d'office2pdf 0.8.1, aux mêmes fonctionnalités : le témoin relit
# avec lui le .pptx qu'il lui passe, pour n'y laisser aucune police (t-898).
zip-office2pdf = { package = "zip", version = "=0.6.6", default-features = false, features = ["deflate"] }
# Lecture des parts XML d'un .pptx (import, t-692) : DOM en lecture seule, sans dépendance.
roxmltree = "0.21"
# Nom, style et droits des polices (import, t-692) ; déjà tiré par typst et fontdb.
ttf-parser = "0.25"
# Polices du système cherchées par l'import hi-fi (CLI, t-692) ; déjà tiré par typst.
fontdb = "0.23"
sha2 = "0.10"
hex = "0.4"
lopdf = "0.45"
typst = "0.15.1"
typst-pdf = "0.15.1"
typst-svg = "0.15.1"
typst-render = "0.15.1"
typst-assets = { version = "0.15.1", features = ["fonts"] }
time = { version = "0.3", features = ["formatting", "local-offset", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
color-eyre = "0.6"
config = { version = "0.15", default-features = false, features = ["toml"] }
opendal = { version = "0.59", default-features = false, features = ["services-fs", "blocking"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
ctrlc = { version = "3.5", features = ["termination"] }
# Mémoire du processus de rendu (limite en RAM, t-327).
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
# Processus de rendu : dup2 de stdout (unix), phys_footprint (macOS).
libc = "0.2"
fluent-bundle = "0.16"
unic-langid = "0.9"
sys-locale = "0.3"
clap = { version = "4", features = ["derive"] }
charts-rs = "1.1"
json-patch = "4"
typst-layout = "0.15.1"
# Aperçu des widgets recadré sur leur dessin (t-392) ; déjà tiré par typst-render.
png = "0.18"
# Témoin du rendu de référence de l'import (t-692, lot 4) : PPTX → PDF en Rust pur, sur Typst 0.15 ;
# sans les polices embarquées de typst-kit (l'appelant passe les siennes). Épinglé : le rapport nomme
# la version (`oku_slides_reference::WITNESS`) et les bornes des tests sont mesurées avec elle.
office2pdf = { version = "=0.8.1", default-features = false }
# Rastérisation des pages du PDF de référence ; déjà tiré par typst-render.
hayro = { version = "0.7.1", default-features = false }
# Serveur de développement (`oku-slides serve`, t-419) ; déjà tiré par rust-mcp-axum.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
# Corps de réponse SSE en flux (`Frame`, que axum ne ré-exporte pas).
http-body = "1"
# Boucle d'accept des serveurs locaux (`oku-slides-platform`, feature `listen`, t-446,
# t-637) : délai de lecture des en-têtes (HTTP/1) et arrêt gracieux des connexions ;
# déjà tirés par axum.
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["http1", "server", "server-graceful", "service", "tokio"] }
# Faux serveur des tests de téléchargement de la dictée (dev-dependency de oku-slides-stt).
tiny_http = "0.12"
similar = "3"
# Catégories Unicode (ponctuation et symboles) : le markdown d'édition suit celles de Lezer.
unicode-properties = { version = "0.1", default-features = false, features = ["general-category"] }
loro = "1.16"
# Dictée
ct2rs = { version = "0.10", default-features = false, features = ["whisper", "ruy"] }
# Même version que ct2rs : son tokenizer se construit depuis un tokenizers::Tokenizer.
tokenizers = { version = "0.22", default-features = false }
mel_spec = "0.3"
ndarray = "0.16"
earshot = "1.2"
cpal = "0.18"
ureq = "3"
# Pont Swift du moteur de dictée d'Apple (build.rs de oku-slides-stt).
swift-rs = "1.0.8"
# Agent local de repli (moteur Gguf, Apple silicon) : llama.cpp avec Metal. Audit du lot 3
# (t-1022) : MIT / Apache-2.0, minos 12.0, +6 Mo. `common` : grammaires GBNF ; pas d'openmp.
llama-cpp-2 = { version = "=0.1.158", default-features = false, features = ["metal", "common"] }
llama-cpp-sys-2 = { version = "=0.1.158", default-features = false }
# App de bureau
tauri = "2.12"
tauri-build = "2"
tauri-plugin-dialog = "2.8"
tauri-plugin-window-state = "2.4"
tauri-plugin-single-instance = "2.4"
# Sans `zip` (défaut) : les paquets v2 (AppImage brut, setup.exe) n'en ont pas besoin, et zip 4
# tombe sous RUSTSEC-2026-0367/0368/0369 (ignorés ailleurs parce qu'on n'appelle pas `extract`).
# rustls-tls active rustls sur le reqwest 0.13 de tauri (racines du système) ; system-proxy : proxy du système.
tauri-plugin-updater = { version = "2.14", default-features = false, features = ["rustls-tls", "system-proxy"] }
tauri-plugin-opener = "2.7"
tauri-runtime = "2.12"
# Tests
hound = "3"
speculoos = "0.13"
insta = { version = "1", features = ["json"] }
# Dossiers de test créés atomiquement, nom aléatoire (t-264).
tempfile = "3"
rstest = "0.26"
proptest = "1"
# Somme de contrôle des snapshots Loro : forger un snapshot malformé mais accepté.
xxhash-rust = { version = "0.8", features = ["xxh32"] }
loro-kv-store = "1.16"
bytes = "1"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[workspace.lints.rust]
missing_debug_implementations = "warn"
unsafe_code = "deny"

[profile.dev.package."*"]
opt-level = 2
# Pas d'infos de débogage pour les dépendances : builds plus légers et plus rapides.
debug = false
