# git-cliff: the app's next version and changelog, computed over every commit since the last v*
# tag (Rust and ui/ alike). release-plz only sees commits that touch crates:
# .github/scripts/release-prepare.sh hands it the version and changelog from here (t-1184).

[changelog]
header = """
# Changelog

All notable changes to Oku Slides are documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

"""
body = """
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}*({{ commit.scope }})* {% endif %}{% if commit.breaking %}[**breaking**] {% endif %}{{ commit.message | split(pat="\n") | first | trim }}
{%- endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
# Commits before t-1183 read "type(scope) : description" (space before the colon): rewritten to
# "type(scope):" before parsing, or none of them would be conventional.
commit_preprocessors = [
  { pattern = '^(\w+(?:\([^)]*\))?!?) : ', replace = "${1}: " },
]
# The <!-- NN --> prefix sets the section order; striptags removes it from the heading.
commit_parsers = [
  { message = '^chore\(release\)', skip = true },
  { message = "^Merge ", skip = true },
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^fix", group = "<!-- 1 -->Fixed" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Changed" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  { message = ".*", group = "<!-- 5 -->Other" },
]
protect_breaking_commits = true
# Version tags only: retrofit/* and the others are ignored.
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
sort_commits = "oldest"

[bump]
features_always_bump_minor = true
breaking_always_bump_major = true
