[package]
name = "oku-slides-stt"
description = "Dictée d'Oku Slides : micro, détection de la voix, Whisper (CTranslate2) ou moteur d'Apple (macOS 26+)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true

[features]
default = []
# macOS : calcul matriciel par Accelerate, le framework d'Apple.
accelerate = ["ct2rs/accelerate"]

[dependencies]
sys-locale.workspace = true
oku-slides-i18n.workspace = true
oku-slides-platform.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
snafu.workspace = true
# CTranslate2, le moteur de faster-whisper.
ct2rs.workspace = true
tokenizers.workspace = true
mel_spec.workspace = true
ndarray.workspace = true
# Détection de la voix, en Rust pur.
earshot.workspace = true
cpal.workspace = true
ureq.workspace = true

# macOS seulement : ailleurs, la bibliothèque de swift-rs liée au script de build y laisse des
# symboles du runtime Swift non résolus (LNK2019 sous Windows).
[target.'cfg(target_os = "macos")'.build-dependencies]
swift-rs = { workspace = true, features = ["build"] }

[dev-dependencies]
tiny_http.workspace = true
speculoos.workspace = true
hound.workspace = true
tempfile.workspace = true

[lints]
workspace = true
