[package]
name = "oku-slides-data"
description = "Deck data: data model and table edits, dataset types, number rules, identifiers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The Parquet engine of bases: enabled by the render worker only (untrusted bytes, sandboxed).
engine = ["dep:polars"]
# Test helpers for other crates: based tables written through the engine.
test-support = ["engine", "dep:tempfile"]

[dependencies]
oku-slides-i18n.workspace = true
hex.workspace = true
imbl.workspace = true
polars = { workspace = true, optional = true }
sha2.workspace = true
tempfile = { workspace = true, optional = true }
serde.workspace = true
# A normal dependency so float_roundtrip is on for every crate that parses deck data.
serde_json = { workspace = true, features = ["float_roundtrip"] }
schemars.workspace = true
snafu.workspace = true
time.workspace = true
uuid.workspace = true

[dev-dependencies]
speculoos.workspace = true
tempfile.workspace = true
rstest.workspace = true

[lints]
workspace = true
