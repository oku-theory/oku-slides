# cargo deny check : licences, avis de sécurité, sources, doublons.

[graph]
all-features = true

[advisories]
# RUSTSEC-2026-0194/0195 (quick-xml 0.38, via typst-library → hayagriva →
# citationberg) : lecture de styles CSL de bibliographie. Écho ne donne jamais
# de fichier de bibliographie à Typst ; à retirer quand Typst suivra.
ignore = [
    { id = "RUSTSEC-2026-0194", reason = "quick-xml via les bibliographies de Typst, jamais atteint par Écho" },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml via les bibliographies de Typst, jamais atteint par Écho" },
]
unmaintained = "workspace"

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[licenses.private]
# Les crates du workspace ne sont pas publiées.
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
