[package]
name = "oku-slides-platform"
description = "Socle d'Oku Slides : journaux, réglages, fichiers et langues, partagés par l'app, la CLI, la session et la dictée ; boucle d'accept bornée des serveurs HTTP locaux (feature `listen`)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
oku-slides-i18n.workspace = true
config.workspace = true
opendal.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
snafu.workspace = true
toml_edit.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
axum = { workspace = true, optional = true }
hyper = { workspace = true, optional = true }
hyper-util = { workspace = true, optional = true }
ureq = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
hex = { workspace = true, optional = true }

[features]
# Boucle d'accept des serveurs HTTP locaux (`listen`) : délai d'en-têtes,
# plafond de connexions, arrêt borné. Activée par la CLI et `oku-slides-mcp`.
listen = ["dep:axum", "dep:hyper", "dep:hyper-util", "tokio/net", "tokio/sync", "tokio/time", "tokio/macros"]

# Téléchargement des modèles épinglés (dictée, agent local) : client HTTP et SHA-256.
download = ["dep:ureq", "dep:sha2", "dep:hex"]

[dev-dependencies]
tiny_http.workspace = true
sha2.workspace = true
hex.workspace = true
speculoos.workspace = true
rstest.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util"] }

[lints]
workspace = true
