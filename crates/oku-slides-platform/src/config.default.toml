# Réglages par défaut d'Oku Slides. Chaque valeur peut être remplacée par
# `config.toml` dans le dossier de données de l'app, puis par une variable
# d'environnement OKU_SLIDES_<SECTION>__<CLÉ> (ex. OKU_SLIDES_PATHS__MODELS=/tmp/modeles).

[paths]
# Dossiers : absents = sous le dossier de données de l'app
# (~/Library/Application Support/me.dartiguenave.oku-slides sur Mac).
# data = "…"
# models = "…"
# widgets = "…"
# layouts = "…"
# themes = "…"
# Où s'enregistre de lui-même un deck qui n'a pas encore de fichier
# (absent = Documents/Oku Slides).
# decks = "…"
# Polices supplémentaires (TTF/OTF), en plus de celles livrées avec l'app.
# fonts = "…"

[history]
# Transactions gardées pour annuler.
limit = 500

[resume]
# Reprises illisibles mises de côté (`resume.failed-…`, `tabs/t-….failed-…`) :
# au lancement, seules les plus récentes restent, dans chacun des deux dossiers
# (0 : aucune ; celles de ce lancement restent jusqu'au suivant).
keep_failed = 3

[sources]
# Taille maximale de l'historique d'un deck lu dans un PDF ou dans la reprise (Mio).
# Borne aussi, approximativement, les ops produites par un import .pptx.
max_replica_mib = 32
# Taille maximale, une fois décompressées, des sources lues dans un PDF :
# historique, images et polices compris (Mio). Borne aussi, approximativement, la
# sortie d'un import .pptx : une estimation précoce, pas une garantie de réouverture.
max_sources_mib = 256
# Délai après lequel un élément ou une slide supprimés sont vraiment effacés à
# l'ouverture (jours d'activité du deck) : passé ce délai, une autre copie du
# deck ne peut plus annuler cette suppression. 0 : jamais.
compact_after_days = 30

[render]
# Durée maximale d'une compilation ou d'un export Typst (ms) ; au-delà, le
# processus de rendu est relancé et le deck se rend avec les widgets de base.
timeout_ms = 10000
# Durée totale des sondes de widgets d'un pack par appel (ms) ; le premier
# fichier exécuté passe toujours, les restants sont sondés au rendu suivant.
probe_budget_ms = 10000
# Mémoire maximale du processus de rendu (Mio).
memory_mib = 2048
# Taille maximale d'un message échangé avec le processus de rendu (Mio).
max_frame_mib = 512
# Taille maximale d'un fichier de widget d'un pack (Kio).
max_widget_kib = 256
# Nombre maximal de fichiers de widgets d'une version de pack, `_commun` compris.
max_widgets = 64

[import]
# Import hi-fi : écart (ΔE OKLab ×100) de la pire région non suspecte d'une slide
# au rendu de référence du témoin au-delà duquel le rapport signale la slide (les
# régions suspectes, erreurs connues d'office2pdf, ne comptent pas). Mesuré sur
# alto, libreoffice et kitchen (office2pdf 0.8.1, 2026-10-16) : bruit au plus 5,8,
# vrais écarts 9,38 (alto, ligne d'introduction p. 6) à 22,5 (tableaux), dont
# 15,71 (alto, encadré p. 7) ; les 8,7 de kitchen p. 2 sont suspects depuis
# t-904 (police que seule la présentation nomme, 2026-10-18). Sous LibreOffice
# (`witness = "soffice"`, 26.8.1.1, 2026-10-18), le même seuil : bruit au plus 6,77
# (titres interlettrés d'alto), vrais écarts 18,2 (tableaux) et 46,1 (graphiques) ;
# alto p. 6 (9,16, une coupure de ligne) et p. 8 (8,76, listes qu'il rétrécit) restent
# signalées ; ses titres en Calibri Light et ses SmartArt sont suspects.
score_threshold = 7.0
# Durée maximale d'une tranche de 20 slides du rendu de référence (ms), dans son
# propre processus de rendu ; au-delà, la référence manque au rapport (« timeout »).
reference_timeout_ms = 30000
# Témoin LibreOffice (`oku-slides import --reference soffice`) : les programmes
# `soffice` essayés dans l'ordre, un nom seul cherché dans PATH ; le binaire de
# LibreOffice, jamais un script sur macOS (le bac à sable du rendu ne lance que lui). Aucun
# trouvé : l'import continue sans écart visuel (« missing »).
soffice = ["/Applications/LibreOffice.app/Contents/MacOS/soffice", "soffice"]
# Durée maximale de LibreOffice pour une tranche de 20 slides (ms), profil neuf
# compris ; passé elle, il est tué avec ses processus enfants.
soffice_timeout_ms = 60000
# Ajustement d'un import hi-fi par l'agent (outils `import_report`, `import_diff`) :
# essais par slide, un essai étant une note d'une slide dont la page rendue (son
# raster) a changé depuis sa note précédente, par l'un ou l'autre outil (au moins 1).
tune_iterations = 3
# Essais de suite sans gain sur l'excès total de la slide (somme de ce que ses
# régions non suspectes dépassent le seuil) après lesquels elle est arrêtée
# (« stalled ») ; au moins 1.
tune_stall = 2
# Essais du deck entier : une page changée par un changement du thème, du pack, des
# jetons ou des paramètres du deck coûte un essai global par état du deck jamais noté,
# quel que soit le nombre de slides changées, et aucun essai de slide ; revenir à un
# état déjà noté (le même contenu du thème et du pack, même enregistré dans une
# nouvelle version) est gratuit. Épuisés, ces changements coûtent un essai à chaque
# slide changée (au moins 1).
tune_global = 3
# Taille maximale d'un .pptx importé (Mio), au moins 1 ; vérifiée avant la lecture,
# un fichier plus gros n'entre jamais en mémoire.
max_input_mib = 256
# Témoin du rendu de référence d'un import hi-fi, dans l'app et pour `oku-slides
# import` sans `--reference` : « office2pdf » (inclus) ou « soffice » (LibreOffice,
# cherché parmi `soffice` ci-dessus). LibreOffice introuvable ou refusé : l'import
# continue sans écart visuel et le rapport dit pourquoi, sans repli sur office2pdf.
witness = "office2pdf"

[serve]
# Serveur de développement (`oku-slides serve`), sans authentification.
# Il ne répond qu'aux requêtes dont l'en-tête Host nomme la boucle locale
# (localhost, 127.0.0.1, ::1) ou `host` lui-même : cela écarte les pages web
# (DNS rebinding), pas un client qui forge Host. Avec une adresse hors boucle
# locale (`0.0.0.0`, `::`, une adresse du réseau), tout client du réseau qui
# envoie `Host: 127.0.0.1` est servi : `serve` l'avertit au démarrage. Voir
# docs/adr/0003-regle-d-origine-des-serveurs-locaux.md.
host = "127.0.0.1"
port = 4870
# Délai pour recevoir les en-têtes d'une requête (ms) : une connexion qui
# n'envoie pas les siens est fermée au-delà.
header_timeout_ms = 10000
# Connexions simultanées au plus (flux d'évènements compris) ; au-delà, une
# nouvelle connexion est fermée aussitôt. Ces deux bornes valent aussi pour le
# serveur d'outils de l'agent (MCP, `127.0.0.1`, port choisi par le système).
# Le plafond vaut par serveur : un serveur d'outils par onglet, chacun le sien.
max_connections = 64

[i18n]
# Langue des messages (`fr`, `en`…) ; absente = celle du système.
# locale = "fr"

[appearance]
# Schéma de l'interface (`light`, `dark`) ; absent = celui du système.
# scheme = "dark"

[author]
# Nom inscrit dans l'historique des decks que vous modifiez ; absent =
# l'utilisateur du système.
# name = "Julie"

[stt]
# Rythme de la boucle d'écoute (ms).
tick_ms = 50
# Sans aucune parole pendant ce temps, l'écoute s'arrête (s).
nothing_heard_secs = 10.0
# Nouvel aperçu quand la phrase en cours a grandi d'au moins (s).
preview_step_secs = 0.5
# Plus courte, une « phrase » est un bruit (claquement) : ignorée (s).
min_phrase_secs = 0.3
# Silence après lequel le compte à rebours de l'arrêt s'affiche (s).
countdown_after_secs = 0.3
# Proposer le moteur de dictée d'Apple (macOS 26+), choisi par défaut ;
# false : Whisper seulement.
apple = true
# Attente maximale du texte final du moteur d'Apple après l'arrêt (s).
apple_finish_timeout_secs = 5.0
# Attente maximale d'une réponse de l'API de dictée (s).
api_timeout_secs = 30.0
# Micro simulé : rejoue ce fichier WAV au lieu du micro (tests, démos).
# fake_mic = "voix.wav"

[stt.vad]
# Score à partir duquel une trame de 16 ms est parlée.
threshold = 0.5
# Trames parlées d'affilée pour ouvrir une phrase.
onset_frames = 3
# Pause qui clôt une phrase (s)…
pause = 0.7
# …si elle dure déjà au moins ceci (s) ; plus courte, elle attend la suite,
min_phrase = 2.5
# sauf après une pause plus longue que celle-ci (s).
long_pause = 1.2
# Audio gardé avant le début et après la fin de la parole (s).
pre_roll = 0.3
post_roll = 0.25
# Longueur maximale d'une phrase (s) : Whisper lit 30 s à la fois.
max_phrase = 25.0

[models]
# Dépôt des modèles téléchargés (dictée, agent local), tentatives et attente
# entre deux tentatives (s).
hub_url = "https://huggingface.co"
download_retries = 5
download_backoff_secs = 4
# Attente maximale (s) d'une réponse ou d'octets du dépôt : une connexion
# bloquée échoue au lieu de figer le téléchargement.
read_timeout_secs = 30

[agent]
# Agent ACP lancé par ⌘⇧D : une clé de [agent.presets], choisie dans le
# panneau de l'agent (écrite dans config.toml). Il ne reçoit que les outils
# d'Oku Slides (serveur MCP local), ni fichiers ni terminal.
# OKU_SLIDES_AGENT__SELECTED impose le choix (le panneau est alors verrouillé).
# Un config.toml peut ajouter un agent : [agent.presets.<id>] name, command, args.
selected = "claude"

[agent.presets.claude]
name = "Claude"
command = "npx"
args = ["-y", "@agentclientprotocol/claude-agent-acp@0.81.2"]

[agent.presets.codex]
name = "Codex"
command = "npx"
args = ["-y", "@agentclientprotocol/codex-acp@2.2.2"]

[agent.presets.gemini]
name = "Gemini"
command = "npx"
args = ["-y", "@google/gemini-cli@0.63.0", "--acp"]

# Agent intégré : un petit modèle qui tourne sur ce Mac, sans compte ni réseau
# (moteur choisi par [local_agent]).
[agent.presets.local]
name = "Local"
builtin = "local"

[local_agent]
# Moteur de l'agent local de repli : "auto" (le meilleur disponible) ou "gguf"
# (llama.cpp sur Apple silicon, modèle Qwen3 4B téléchargé depuis le panneau de l'agent).
engine = "auto"
# Contexte du modèle (jetons), température, longueur maximale d'une réponse (jetons).
context = 16384
temperature = 0.3
max_reply_tokens = 1024
# Tests (builds de débogage) : engine = "fake" rejoue ce script et journalise chaque appel.
# fake_script = "script.json"
# fake_log = "log.jsonl"

[updates]
# Chercher une version plus récente au lancement, puis toutes les `check_interval_hours` heures
# (jamais dans une version de développement). Off : seulement par « Rechercher des mises à jour… ».
check_automatically = true
check_interval_hours = 6
