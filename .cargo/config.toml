# `cargo tauri` exports MACOSX_DEPLOYMENT_TARGET from `bundle.macOS.minimumSystemVersion`
# (src-tauri/tauri.conf.json). C build scripts (psm, ring…) depend on it: without the same
# value here, every switch between `just dev` / `just test` / rust-analyzer rebuilds typst and
# everything that depends on it. Keep both values in sync.
[env]
MACOSX_DEPLOYMENT_TARGET = "13.4"
