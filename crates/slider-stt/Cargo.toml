[package]
name = "slider-stt"
description = "Dictée d'Écho : micro, détection de la voix, Whisper sur CTranslate2 en local."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true

[features]
default = []
# macOS : calcul matriciel par Accelerate, le framework d'Apple.
accelerate = ["ct2rs/accelerate"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# CTranslate2, le moteur de faster-whisper.
ct2rs = { version = "0.10", default-features = false, features = ["whisper", "ruy"] }
mel_spec = "0.3"
ndarray = "0.16"
# Détection de la voix, en Rust pur.
earshot = "1.2"
cpal = "0.18"
ureq = "3"

[dev-dependencies]
hound = "3"
