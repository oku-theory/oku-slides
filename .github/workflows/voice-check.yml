# OS voices of read-aloud off macOS (t-1002, Q11). Nobody here runs Windows or Linux: this job is the
# only place the WinRT speech code and the Speech Dispatcher driver of oku-slides-stt are compiled,
# the prebuilt ONNX Runtime linked off macOS, and the Linux voice tested (speak::). `just ci` stays
# the full gate, on macOS; release.yml builds the apps.
# Runs on every push to main or PR touching Rust code, and by hand from the Actions tab.
name: Voice check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "**/Cargo.toml"
      - Cargo.lock
      - rust-toolchain.toml
      - .cargo/**
      - .github/workflows/voice-check.yml
  pull_request:
    paths:
      - "crates/**"
      - "**/Cargo.toml"
      - Cargo.lock
      - rust-toolchain.toml
      - .cargo/**
      - .github/workflows/voice-check.yml

permissions:
  contents: read

concurrency:
  group: voice-check-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    name: Speech (Windows)
    # Same image as release.yml's Windows build: its MSVC must not be older than the one that
    # built the prebuilt ONNX Runtime (VS 2022 17.14).
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # aws-lc-sys assembles with NASM, absent from the runner image: its prebuilt objects replace
      # it, as in release.yml. Dynamic CRT (no `+crt-static`), as release.yml: the prebuilt ONNX
      # Runtime is built /MD.
      - name: Prebuilt NASM
        shell: bash
        run: echo "AWS_LC_SYS_PREBUILT_NASM=1" >> "$GITHUB_ENV"

      # Same pin as release.yml and rust-toolchain.toml (t-1201).
      - uses: dtolnay/rust-toolchain@18f0487477426dce244608110aa2660c2893deb7 # 1.98.1

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: voice-check-windows

      # A link, not a check: the test binaries link ONNX Runtime, DirectML and the CRT as the app.
      - name: Link
        run: cargo test -p oku-slides-stt --no-run

  linux:
    name: Speech (Linux)
    # The Linux release image (release.yml): the prebuilt ONNX Runtime needs glibc 2.38 or later,
    # so 22.04 cannot link it (t-1663).
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # ALSA headers for the microphone crates; speech-dispatcher, the Linux voice (its tests use a fake).
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev speech-dispatcher

      - uses: dtolnay/rust-toolchain@18f0487477426dce244608110aa2660c2893deb7 # 1.98.1

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: voice-check-linux

      # A link, not a check: the test binaries link ONNX Runtime as the app does.
      - name: Link
        run: cargo test -p oku-slides-stt --no-run

      - name: Speech tests
        run: "cargo test -p oku-slides-stt speak::"
